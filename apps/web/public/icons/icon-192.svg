<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <!-- Gold/Yellow Sparkle Gradient -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <!-- Glow Filter for Sparkles -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-gradient)" />

  <!-- Stylized Diary / Notebook -->
  <!-- Main Cover -->
  <rect x="140" y="110" width="250" height="310" rx="20" fill="#ffffff" opacity="0.95" />
  
  <!-- Spine Cover Highlight -->
  <rect x="140" y="110" width="40" height="310" rx="4" fill="#d8b4fe" />

  <!-- Notebook Rings/Binding -->
  <path d="M 120,150 L 155,150
           M 120,210 L 155,210
           M 120,270 L 155,270
           M 120,330 L 155,330
           M 120,390 L 155,390" 
        stroke="#4f46e5" stroke-width="12" stroke-linecap="round" />

  <!-- Diary Page Lines (Representing writing/worklog) -->
  <line x1="200" y1="180" x2="350" y2="180" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
  <line x1="200" y1="240" x2="350" y2="240" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
  <line x1="200" y1="300" x2="350" y2="300" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />
  <line x1="200" y1="360" x2="300" y2="360" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" />

  <!-- AI Sparkles / Stars (glowing on the top right) -->
  <!-- Large Sparkle -->
  <path d="M 390,70 Q 390,110 430,110 Q 390,110 390,150 Q 390,110 350,110 Q 390,110 390,70 Z" 
        fill="url(#sparkle-grad)" filter="url(#glow)" />
  <!-- Small Sparkle -->
  <path d="M 430,140 Q 430,160 450,160 Q 430,160 430,180 Q 430,160 410,160 Q 430,160 430,140 Z" 
        fill="#fef08a" />
</svg>